name: Deploy Azure Function

run-name: Deploy latest successful master CI to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub deployment environment
        required: true
        default: production
        type: environment

permissions:
  actions: read

env:
  RESOURCE_GROUP: TG_AI_BOT_NEU

concurrency:
  group: deployment-${{ inputs.environment }}-TG_AI_BOT_NEU
  cancel-in-progress: false

jobs:
  resolve-ci-run:
    name: Find latest successful CI run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      run_attempt: ${{ steps.resolve.outputs.run_attempt }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
    steps:
      - name: Find latest successful CI run
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_json="$(gh api \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0]')"

          if [[ -z "$run_json" || "$run_json" == "null" ]]; then
            echo "::error::No successful CI workflow run was found for a master push."
            exit 1
          fi

          run_id="$(jq -r '.id' <<< "$run_json")"
          run_attempt="$(jq -r '.run_attempt' <<< "$run_json")"
          head_sha="$(jq -r '.head_sha' <<< "$run_json")"

          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "::error::The latest successful CI run returned an invalid run ID or attempt."
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The latest successful CI run did not return a valid commit SHA."
            exit 1
          fi

          artifact_name="ci-${run_id}.${run_attempt}-${head_sha:0:7}"
          artifacts_json="$(gh api \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_count="$(jq \
            --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            <<< "$artifacts_json")"
          if [[ "$artifact_count" != "1" ]]; then
            echo "::error::Latest successful master CI run ${run_id} attempt ${run_attempt} has no single retained artifact named '${artifact_name}'. It may be missing or expired; no older CI run will be deployed."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Pinned CI run $run_id (attempt $run_attempt), commit $head_sha, artifact \`$artifact_name\`." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy infrastructure and application
    needs: resolve-ci-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Download pinned deployment bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.resolve-ci-run.outputs.artifact_name }}
          path: bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-ci-run.outputs.run_id }}

      - name: Verify deployment bundle
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ needs.resolve-ci-run.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.resolve-ci-run.outputs.run_attempt }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve-ci-run.outputs.head_sha }}
        run: |
          set -euo pipefail

          for file in \
            bundle/function-app.zip \
            bundle/infrastructure/main.json \
            bundle/infrastructure/main.parameters.json \
            bundle/metadata.json; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::The pinned CI bundle is missing required non-empty file '$file'."
              exit 1
            fi
          done

          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$EXPECTED_HEAD_SHA" \
            --arg runId "$EXPECTED_RUN_ID" \
            --arg runAttempt "$EXPECTED_RUN_ATTEMPT" \
            '.bundleVersion == 1
              and .repository == $repository
              and .workflow == "ci.yml"
              and .event == "push"
              and .ref == "refs/heads/master"
              and .commitSha == $sha
              and .runId == $runId
              and .runAttempt == $runAttempt' \
            bundle/metadata.json > /dev/null; then
            echo "::error file=bundle/metadata.json::The pinned CI bundle metadata is incompatible or does not match the resolved run, attempt, and commit."
            exit 1
          fi
          if ! jq -e \
            '.["$schema"] | strings | contains("deploymentTemplate.json#")' \
            bundle/infrastructure/main.json > /dev/null ||
            ! jq -e \
              '.contentVersion == "1.0.0.0" and (.resources | type == "array")' \
              bundle/infrastructure/main.json > /dev/null; then
            echo "::error file=bundle/infrastructure/main.json::The pinned CI bundle does not contain a compatible ARM template."
            exit 1
          fi
          if ! jq -e \
            '.["$schema"] | strings | contains("deploymentParameters.json#")' \
            bundle/infrastructure/main.parameters.json > /dev/null ||
            ! jq -e \
              '.contentVersion == "1.0.0.0"
                and (.parameters.environmentName.value | type == "string")
                and (.parameters.environmentName.value | length > 0)' \
              bundle/infrastructure/main.parameters.json > /dev/null; then
            echo "::error file=bundle/infrastructure/main.parameters.json::The pinned CI bundle does not contain compatible ARM parameters."
            exit 1
          fi
          if ! unzip -t bundle/function-app.zip > /dev/null; then
            echo "::error file=bundle/function-app.zip::The pinned CI application ZIP is invalid."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure
        shell: bash
        run: |
          set -euo pipefail
          function_app_name="$(az deployment group create \
            --name "infrastructure-${{ github.run_id }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file bundle/infrastructure/main.json \
            --parameters @bundle/infrastructure/main.parameters.json \
            --query properties.outputs.functionAppName.value \
            --output tsv)"
          if [[ -z "$function_app_name" ]]; then
            echo "::error::Infrastructure deployment did not return a Function App name."
            exit 1
          fi
          echo "FUNCTION_APP_NAME=$function_app_name" >> "$GITHUB_ENV"

      - name: Deploy application artifact
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --src bundle/function-app.zip
