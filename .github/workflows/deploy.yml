name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub deployment environment
        required: true
        default: production
        type: environment

permissions:
  contents: read
  actions: read

env:
  RESOURCE_GROUP: TG_AI_BOT_NEU

concurrency:
  group: deployment-${{ inputs.environment }}-TG_AI_BOT_NEU
  cancel-in-progress: false

jobs:
  resolve-ci-run:
    name: Find latest successful CI run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      run_attempt: ${{ steps.resolve.outputs.run_attempt }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Find latest successful CI run
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_json="$(gh api \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0]')"

          if [[ -z "$run_json" || "$run_json" == "null" ]]; then
            echo "::error::No successful CI workflow run was found for a master push."
            exit 1
          fi

          run_id="$(jq -r '.id' <<< "$run_json")"
          run_attempt="$(jq -r '.run_attempt' <<< "$run_json")"
          head_sha="$(jq -r '.head_sha' <<< "$run_json")"

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The latest successful CI run did not return a valid commit SHA."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Deploying CI run $run_id (attempt $run_attempt), commit $head_sha" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate and preview infrastructure
    needs: resolve-ci-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-ci-run.outputs.head_sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Lint Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep lint --file deployment/main.bicep

      - name: Build Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file deployment/main.bicep

      - name: Validate Azure deployment
        shell: bash
        run: |
          set -euo pipefail
          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deployment/main.bicep \
            --parameters deployment/main.bicepparam

      - name: Preview Azure deployment
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deployment/main.bicep \
            --parameters deployment/main.bicepparam

  deploy:
    name: Deploy infrastructure and application
    needs:
      - resolve-ci-run
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-ci-run.outputs.head_sha }}

      - name: Download application artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: function-app-${{ needs.resolve-ci-run.outputs.run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-ci-run.outputs.run_id }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure
        shell: bash
        run: |
          set -euo pipefail
          function_app_name="$(az deployment group create \
            --name "infrastructure-${{ github.run_id }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file deployment/main.bicep \
            --parameters deployment/main.bicepparam \
            --query properties.outputs.functionAppName.value \
            --output tsv)"
          if [[ -z "$function_app_name" ]]; then
            echo "::error::Infrastructure deployment did not return a Function App name."
            exit 1
          fi
          echo "FUNCTION_APP_NAME=$function_app_name" >> "$GITHUB_ENV"

      - name: Deploy application artifact
        shell: bash
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --src function-app.zip
