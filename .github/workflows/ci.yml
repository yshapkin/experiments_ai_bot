name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node.js project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Bicep
        shell: bash
        run: |
          set -euo pipefail

          formatted_file="$(mktemp)"
          lint_results="$(mktemp)"
          lint_diagnostics="$(mktemp)"
          trap 'rm -f "$formatted_file" "$lint_results" "$lint_diagnostics"' EXIT

          for file in deployment/main.bicep deployment/main.bicepparam; do
            az bicep format --file "$file" --stdout > "$formatted_file"
            if ! diff -u "$file" "$formatted_file"; then
              echo "::error file=$file::Run 'az bicep format --file $file' to fix formatting."
              exit 1
            fi
          done

          for file in deployment/main.bicep deployment/main.bicepparam; do
            if ! az bicep lint --file "$file" --diagnostics-format sarif > "$lint_results" 2> "$lint_diagnostics"; then
              cat "$lint_diagnostics"
              cat "$lint_results"
              exit 1
            fi
            if ! jq -e 'all(.runs[]?.results[]?; (.level // "warning") != "warning" and (.level // "warning") != "error")' "$lint_results" > /dev/null; then
              echo "::error file=$file::Bicep linter reported issues."
              cat "$lint_diagnostics"
              cat "$lint_results"
              exit 1
            fi
          done
          az bicep build --file deployment/main.bicep --stdout > /dev/null
          az bicep build-params --file deployment/main.bicepparam --stdout > /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production output
        run: npm run build

      - name: Remove development dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm prune --omit=dev

      - name: Create versioned deployment bundle
        id: bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          bundle_name="ci-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          bundle_directory="${RUNNER_TEMP}/${bundle_name}"

          mkdir -p "${bundle_directory}/infrastructure"
          zip -r "${bundle_directory}/function-app.zip" \
            dist host.json package.json package-lock.json node_modules
          az bicep build \
            --file deployment/main.bicep \
            --outfile "${bundle_directory}/infrastructure/main.json"
          az bicep build-params \
            --file deployment/main.bicepparam \
            --outfile "${bundle_directory}/infrastructure/main.parameters.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              bundleVersion: 1,
              repository: $repository,
              workflow: "ci.yml",
              event: "push",
              ref: "refs/heads/master",
              commitSha: $commitSha,
              runId: $runId,
              runAttempt: $runAttempt
            }' > "${bundle_directory}/metadata.json"

          echo "name=$bundle_name" >> "$GITHUB_OUTPUT"
          echo "directory=$bundle_directory" >> "$GITHUB_OUTPUT"

      - name: Upload deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
